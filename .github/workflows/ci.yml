name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pgvectordb/

      # - name: Type check with pyright
      #   run: pyright pgvectordb/

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, pathlib, sys
          errors = []
          for p in pathlib.Path('pgvectordb').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'), str(p))
              except SyntaxError as e:
                  errors.append(f'SYNTAX ERROR in {p}: {e}')
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          print(f'All {sum(1 for _ in pathlib.Path(\"pgvectordb\").rglob(\"*.py\"))} files OK')
          "

      - name: Verify package builds
        run: |
          pip install hatch
          hatch build
